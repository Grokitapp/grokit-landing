<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons: files live in /public so they have fixed URLs in production -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F85F1A" />

    <!-- Start fetching the hero image in parallel with the JS bundle -->
    <link rel="preload" as="image" href="/hero-mascot.webp" type="image/webp" fetchpriority="high" />

    <!-- If course cover images come from another host (S3 / CloudFront), uncomment and set the host:
    <link rel="preconnect" href="https://YOUR-IMAGE-HOST" crossorigin />
    -->

    <title>Grokit - Turn any curiosity into real understanding</title>
    <meta name="description" content="A personalized learning path, built just for you. Grounded in real knowledge." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
