version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --include=optional
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir . --outputs-format json

frontend:
  phases:
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

cache:
  paths:
    - .npm/**/*