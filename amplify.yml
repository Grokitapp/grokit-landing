version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --include=optional
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir . --outputs-format json

frontend:
  phases:
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  customHeaders:
    - pattern: '/assets/*'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
    - pattern: '/*.webp'
      headers:
        - key: Cache-Control
          value: 'public, max-age=86400, stale-while-revalidate=604800'
    - pattern: '/*.png'
      headers:
        - key: Cache-Control
          value: 'public, max-age=86400, stale-while-revalidate=604800'

cache:
  paths:
    - .npm/**/*