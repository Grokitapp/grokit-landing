version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --include=optional
        - npm install --no-save @parcel/watcher-linux-x64-glibc@2.6.0
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*